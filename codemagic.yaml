workflows:
  android-app:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Make gradlew executable
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi
      - name: Build Android Debug APK
        script: ./gradlew assembleDebug --stacktrace
    artifacts:
      - build/outputs/**/*.apk
      - app/build/outputs/**/*.apk
